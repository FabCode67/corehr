<svg xmlns="http://www.w3.org/2000/svg" width="220" height="260" viewBox="0 0 220 260">
  <!--
    Vivid Kitenge/Gitenge wax-print motif for the landing page hero —
    pinwheel diamond medallions (four color quadrants around a center
    cross, cream stitch outline) alternating with a chevron "flag" ribbon
    column, framed by a triangle-flag border top and bottom, with small
    dot accents in the negative space. Colors are the app's brand core
    (navy #0A2647, gold #B8860B, chocolate #3B2412) plus the same
    extended accent hues already used for chart/data-viz color elsewhere
    in this app (terracotta #D85A30, dusty pink #D4537E) — so the
    landing page and the rest of the product read as one palette.
    Tileable at 220x260, drawn transparent so the section's own dark
    chocolate background shows through as the "black" base, matching the
    reference gitenge fabric's near-black ground.
  -->

  <!-- Pinwheel diamond medallion 1 -->
  <g>
    <polygon points="60,20 100,70 60,120 20,70" fill="#B8860B" opacity="0.92" />
    <polygon points="60,20 100,70 60,70" fill="#B8860B" opacity="0.92" />
    <polygon points="100,70 60,120 60,70" fill="#D85A30" opacity="0.92" />
    <polygon points="60,120 20,70 60,70" fill="#0A2647" opacity="0.85" />
    <polygon points="20,70 60,20 60,70" fill="#D4537E" opacity="0.88" />
    <polygon points="60,20 100,70 60,120 20,70" fill="none" stroke="#F3DFC1" stroke-width="2" opacity="0.75" />
    <line x1="60" y1="20" x2="60" y2="120" stroke="#F3DFC1" stroke-width="1.5" opacity="0.55" />
    <line x1="20" y1="70" x2="100" y2="70" stroke="#F3DFC1" stroke-width="1.5" opacity="0.55" />
    <circle cx="60" cy="70" r="6" fill="#F3DFC1" opacity="0.9" />
    <circle cx="60" cy="70" r="6" fill="none" stroke="#3B2412" stroke-width="1" opacity="0.5" />
  </g>

  <!-- Pinwheel diamond medallion 2 (recolored, offset lower) -->
  <g>
    <polygon points="60,150 100,196 60,242 20,196" fill="#D4537E" opacity="0.85" />
    <polygon points="60,150 100,196 60,196" fill="#D4537E" opacity="0.85" />
    <polygon points="100,196 60,242 60,196" fill="#B8860B" opacity="0.92" />
    <polygon points="60,242 20,196 60,196" fill="#D85A30" opacity="0.9" />
    <polygon points="20,196 60,150 60,196" fill="#0A2647" opacity="0.85" />
    <polygon points="60,150 100,196 60,242 20,196" fill="none" stroke="#F3DFC1" stroke-width="2" opacity="0.7" />
    <line x1="60" y1="150" x2="60" y2="242" stroke="#F3DFC1" stroke-width="1.5" opacity="0.5" />
    <line x1="20" y1="196" x2="100" y2="196" stroke="#F3DFC1" stroke-width="1.5" opacity="0.5" />
    <circle cx="60" cy="196" r="5" fill="#F3DFC1" opacity="0.85" />
  </g>

  <!-- Small hollow guide diamonds echoing the reference's outline-only motif -->
  <polygon points="60,4 68,20 60,36 52,20" fill="none" stroke="#B8860B" stroke-width="1.5" opacity="0.5" />
  <polygon points="60,224 68,242 60,260 52,242" fill="none" stroke="#D85A30" stroke-width="1.5" opacity="0.45" />

  <!-- Chevron "flag" ribbon column -->
  <polyline
    points="150,0 220,25 150,50 220,75 150,100 220,125 150,150 220,175 150,200 220,225 150,250 220,260"
    fill="none" stroke="#F3DFC1" stroke-width="3" opacity="0.55"
  />
  <polyline
    points="158,4 212,24 158,44 212,64 158,84 212,104 158,124 212,144 158,164 212,184 158,204 212,224 158,244"
    fill="none" stroke="#D85A30" stroke-width="1.5" opacity="0.4"
  />
  <polyline
    points="150,12.5 185,25 150,37.5 185,50 150,62.5 185,75 150,87.5 185,100 150,112.5 185,125 150,137.5 185,150 150,162.5 185,175 150,187.5 185,200 150,212.5 185,225 150,237.5 185,250"
    fill="none" stroke="#0A2647" stroke-width="1.5" opacity="0.35"
  />

  <!-- Triangle-flag borders (top and bottom edge) -->
  <g opacity="0.8">
    <polygon points="0,0 15,0 7.5,14" fill="#D85A30" opacity="0.7" />
    <polygon points="30,0 45,0 37.5,14" fill="#B8860B" opacity="0.75" />
    <polygon points="60,0 75,0 67.5,14" fill="#0A2647" opacity="0.7" />
    <polygon points="90,0 105,0 97.5,14" fill="#D4537E" opacity="0.7" />
    <polygon points="120,0 135,0 127.5,14" fill="#D85A30" opacity="0.7" />
  </g>
  <g opacity="0.8">
    <polygon points="0,260 15,260 7.5,246" fill="#0A2647" opacity="0.7" />
    <polygon points="30,260 45,260 37.5,246" fill="#D4537E" opacity="0.7" />
    <polygon points="60,260 75,260 67.5,246" fill="#B8860B" opacity="0.75" />
    <polygon points="90,260 105,260 97.5,246" fill="#D85A30" opacity="0.7" />
    <polygon points="120,260 135,260 127.5,246" fill="#0A2647" opacity="0.7" />
  </g>

  <!-- Scattered dot accents filling negative space -->
  <circle cx="130" cy="70" r="3" fill="#F3DFC1" opacity="0.6" />
  <circle cx="130" cy="196" r="3" fill="#F3DFC1" opacity="0.55" />
  <circle cx="10" cy="120" r="2.5" fill="#D85A30" opacity="0.55" />
  <circle cx="10" cy="160" r="2.5" fill="#B8860B" opacity="0.5" />
</svg>
