<svg xmlns="http://www.w3.org/2000/svg" width="140" height="200" viewBox="0 0 140 200">
  <!--
    Mudcloth-style Kitenge motif: an alternating column of diamond
    medallions (chocolate/gold, nested diamond + center dot) next to a
    narrow chevron "mudcloth" stripe column, framed by a dashed seam.
    Tileable at 140x200, drawn transparent so the section's own
    background (bg-primary) shows through as the "black" base.
  -->

  <!-- Diamond medallion 1 (chocolate) -->
  <g>
    <polygon points="45,10 83,50 45,90 7,50" fill="#3B2412" opacity="0.85" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.6" />
    <polygon points="45,25 68,50 45,75 22,50" fill="none" stroke="#B8860B" stroke-width="1.5" opacity="0.6" />
    <circle cx="45" cy="50" r="5" fill="#B8860B" opacity="0.8" />
  </g>

  <!-- Diamond medallion 2 (gold) -->
  <g>
    <polygon points="45,110 83,150 45,190 7,150" fill="#B8860B" opacity="0.55" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.6" />
    <polygon points="45,125 68,150 45,175 22,150" fill="none" stroke="#3B2412" stroke-width="1.5" opacity="0.6" />
    <circle cx="45" cy="150" r="5" fill="#FFFFFF" opacity="0.6" />
  </g>

  <!-- Dashed seam between the diamond column and the chevron column -->
  <polyline
    points="95,0 100,10 90,20 100,30 90,40 100,50 90,60 100,70 90,80 100,90 90,100 100,110 90,120 100,130 90,140 100,150 90,160 100,170 90,180 100,190 95,200"
    fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4"
  />

  <!-- Chevron / mudcloth stripe column -->
  <polyline
    points="100,0 140,12.5 100,25 140,37.5 100,50 140,62.5 100,75 140,87.5 100,100 140,112.5 100,125 140,137.5 100,150 140,162.5 100,175 140,187.5 100,200"
    fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.5"
  />
  <polyline
    points="106,3 134,15.5 106,28 134,40.5 106,53 134,65.5 106,78 134,90.5 106,103 134,115.5 106,128 134,140.5 106,153 134,165.5 106,178 134,190.5"
    fill="none" stroke="#B8860B" stroke-width="1.5" opacity="0.35"
  />
</svg>
